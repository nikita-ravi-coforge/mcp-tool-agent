[project]
name = "equipment"
version = "0.1.0"
description = "IT equipment request handler: MCP server + ReAct agent"
requires-python = ">=3.11"
dependencies = ["mcp"]

[dependency-groups]
dev = ["pytest", "pytest-cov"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/equipment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=equipment --cov-branch --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
# The server runs as a subprocess in integration tests; measure it too.
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
